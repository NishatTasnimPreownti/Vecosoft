<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Tracking Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="demo-switcher" role="group" aria-label="Demo scenario switcher">
    <span class="demo-switcher__label">Demo scenario</span>
    <div class="demo-switcher__options" id="scenarioSwitcher"></div>
  </div>

  <main class="phone">
    <header class="topbar">
      <button class="iconbtn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>Order tracking</h1>
      <button class="iconbtn" aria-label="Share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="hero" id="hero"></section>

    <section class="card timeline-card" id="timelineCard">
      <h2 class="card__title">Delivery progress</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section class="card order-card" id="orderCard"></section>

    <section class="actions" id="actions"></section>
  </main>

<script src="script.js"></script>
</body>
</html>
